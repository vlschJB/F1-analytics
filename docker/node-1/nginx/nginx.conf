events {
    worker_connections 1024;
}

http {
    # Cloudflare real IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Upstreams
    upstream fastapi_backend {
        server fastapi:8000;
    }

    upstream streamlit_backend {
        server streamlit:8501;
    }

    upstream airflow_backend {
        server 89.37.192.126:8081;
    }

    upstream spark_master_backend {
        server 89.37.192.126:8080;
    }

    upstream spark_worker_backend {
        server 89.37.192.126:8082;
    }

    # ==================== yoyorace.tech (главная) ====================
    server {
        listen 443 ssl http2;
        server_name yoyorace.tech www.yoyorace.tech;

        ssl_certificate /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        limit_req zone=general burst=20 nodelay;
    }

    # ==================== app.yoyorace.tech (дашборды) ====================
    server {
        listen 443 ssl http2;
        server_name app.yoyorace.tech;

        ssl_certificate /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://streamlit_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        limit_req zone=general burst=20 nodelay;
    }

    # ==================== af.yoyorace.tech (Airflow) ====================
    server {
        listen 443 ssl http2;
        server_name af.yoyorace.tech;

        ssl_certificate /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Подключаем список разрешённых IP из отдельного файла
        include /etc/nginx/allow-list.conf;

        auth_basic "Airflow Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://airflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
        }

        error_page 403 /403.html;
        location = /403.html {
            return 200 '{"error":"Access denied","message":"This resource is restricted. Contact admin."}\n';
            add_header Content-Type application/json;
        }

        limit_req zone=general burst=10 nodelay;
    }

    # ==================== etl.yoyorace.tech (Spark) ====================
    server {
        listen 443 ssl http2;
        server_name etl.yoyorace.tech;

        ssl_certificate /etc/nginx/ssl/origin-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/origin-key.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Подключаем список разрешённых IP из отдельного файла
        include /etc/nginx/allow-list.conf;

        auth_basic "Spark Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://spark_master_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /worker/ {
            proxy_pass http://spark_worker_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        error_page 403 /403.html;
        location = /403.html {
            return 200 '{"error":"Access denied","message":"This resource is restricted. Contact admin."}\n';
            add_header Content-Type application/json;
        }

        limit_req zone=general burst=10 nodelay;
    }

    # ==================== HTTP → HTTPS redirect ====================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}