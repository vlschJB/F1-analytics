version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/allow-list.conf:/etc/nginx/allow-list.conf:ro
    depends_on:
      - fastapi
      - streamlit
    restart: unless-stopped
    networks:
      - f1-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    expose:
      - "8123"
      - "9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-f1db}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '4'
    restart: unless-stopped
    networks:
      - f1-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fastapi:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: fastapi
    expose:
      - "8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-f1db}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - f1-network

  streamlit:
    build:
      context: ../../streamlit
      dockerfile: Dockerfile
    container_name: streamlit
    expose:
      - "8501"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-f1db}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    depends_on:
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    restart: unless-stopped
    networks:
      - f1-network

networks:
  f1-network:
    driver: bridge

volumes:
  clickhouse_data: